name: keep-ai-alive

# pf-ai (Render free tier) se duerme tras 15 min sin trafico y tarda 1-3 min
# en volver a arrancar: es un contenedor Docker con Python (numpy/pandas/
# scikit-learn/xgboost) sobre 0.1 vCPU (ver Dashboard.jsx). Este workflow lo
# pinguea cada 10 min en horario habil para que casi nunca este dormido
# cuando alguien lo necesita.
#
# Solo se pinguea pf-ai (no pf-backend): el cold start de Node es rapido y
# tolerable, y el pool gratuito de Render son 750h/mes COMPARTIDAS entre
# todos los servicios free del workspace. Mantener ambos servicios siempre
# despiertos las 24hs lo agotaria a mitad de mes y Render suspenderia los
# servicios free hasta el mes siguiente.
#
# El cron de GitHub Actions corre en UTC. Argentina = UTC-3 (sin horario de
# verano). Ventana deseada: todos los dias, 7:00-23:00 hora Argentina, que en
# UTC es el conjunto de horas 10-23 y 0-2 (cruza la medianoche UTC, por eso
# el campo de horas junta ambos rangos separados por coma). Al cubrir los 7
# dias no hace falta restringir dia-de-semana.
# Uso estimado: ~16h/dia x 30 dias =~ 480h/mes, todavia bien por debajo del
# pool compartido de 750h (deja ~270h de margen para pf-backend y uso real).
on:
  schedule:
    - cron: "*/10 10-23,0-2 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping pf-ai /health
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" \
            --max-time 90 https://pf-ai.onrender.com/health || \
            echo "Ping fallo (probablemente cold start en curso, se reintenta en 10 min)"
